# Step 26 — synthetic degradation pipeline config.
# Read only by scripts/degrade_nist_pairs.py. Turns Step 25's clean NIST Stage A crops
# (data/annot/nist/, FINAL -- read-only input, see plan.md Step 26's warning) into
# synthetic replicas of the 1964 A&S scan, so Step 27/28 can train/fine-tune the OCR
# reader on formula-level (image, latex) pairs that actually look like the real corpus.
# Kept separate from configs/config.yaml for the same reason as configs/nist_extract.yaml:
# a one-shot data-prep tool, not a knob the retrieval/agent system reads at runtime.

pairs_path: "data/annot/nist/pairs.jsonl"   # Step 25's output -- read-only, never written to
out_dir: "data/interim/nist_degraded"       # gitignored (data/interim/ already ignored, see
                                             # .gitignore) -- reproducible in one seeded run,
                                             # not committed; only the 3 examples below are
examples_dir: "reports/figures"             # committed: side-by-side comparison PNGs
n_examples: 3

seed: 26   # step number, for a memorable and reproducible seed

# --- Calibration target: measured A&S page statistics -------------------------------
# Verified 2026-08-11 (S2) over a random sample of 15 of the 1082 rendered
# data/pages/*.png (grayscale L-mode pixel mean/std): mean brightness 196.3, contrast
# std 32.8 -- matches plan.md Step 26's stated "measured A&S stats" (~198 / ~32) closely
# enough to use directly as calibration targets rather than re-deriving new ones.
target:
  dpi: 300
  mean_brightness: 198.0
  contrast_std: 32.0

# --- Padding --------------------------------------------------------------------------
# NIST crops are tightly bound to one formula's own bounding box (measured: a few
# hundred px wide, commonly under 100px tall -- extreme, non-page-like aspect ratios,
# NOT full-page-sized like data/annot/val|train's images; crop_padding_pt in
# configs/nist_extract.yaml only leaves ~3pt of margin, so text often sits right at the
# crop edge). Pad with a plain margin before rotating/warping so glyphs at the crop
# edge don't clip.
#
# fill is intentionally NOT target.mean_brightness. Measured local paper-white
# (p90-p99 pixel brightness in whitespace regions of real data/pages/*.png, away from
# any ink) is ~210-219, lighter than the 198 page-wide mean above -- the page-wide mean
# is pulled down by denser ink elsewhere on the page and is the right target for the
# FINAL calibrate() step (whole degraded image vs. a whole real page), but too dark for
# a *local* margin immediately around one isolated formula. Using 198 here first
# produced a visible two-tone "box" seam around the crop in the rendered examples
# (caught by eye, not assumed) -- 214 (~p90-p95 midpoint) reads as a much more
# plausible single surface once blur/noise/calibration are applied on top.
padding:
  fill: 214.0
  frac_of_size: 0.35   # margin width/height, as a fraction of the crop's own width/height

# --- Randomized per-sample ops --------------------------------------------------------
# Every [low, high] range is sampled per crop from a seeded per-sample RNG (seed + index),
# so any single crop's degraded output is independently reproducible.
rotation_deg: [-0.5, 0.5]
elastic_warp:
  alpha: [8, 20]              # displacement field magnitude, px
  sigma: [4, 8]                # smoothing of the displacement field, px
gaussian_blur_sigma: [0.3, 1.1]
sensor_noise_std: [2.0, 8.0]
paper_tone_shift: [-6.0, 6.0]              # additive brightness shift, applied before calibration
uneven_illumination_strength: [0.0, 0.18]  # 0 = none, 0.18 = visible corner-to-corner falloff
ink_bleed_or_thin_kernel: [1, 2]           # odd morphological dilate(bleed)/erode(thin) radius, px
downsample_factor: [1.3, 2.2]              # downsample by this factor, then upsample back (300dpi
                                            # in, 300dpi out -- simulates print/scan resolution loss)
